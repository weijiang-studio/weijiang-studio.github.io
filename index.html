:contain;display:block;margin:10px 0}.upload input{font-size:10px;padding:5px}.prompt{white-space:pre-wrap;line-height:1.9;font-size:13px;min-height:210px}.check{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}.check input{width:18px;height:18px;margin-top:5px}.check .body{flex:1}.check p{font-size:12px}.check input[type=text]{width:100%;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.tablewrap{overflow:auto}dialog{border:1px solid var(--line);border-radius:12px;width:700px;max-width:94vw;padding:26px;max-height:90vh;overflow:auto}dialog::backdrop{background:#202a215e;backdrop-filter:blur(3px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#29392c;color:white;padding:12px 24px;border-radius:8px;z-index:10;display:none}.herofoot{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:22px}.steps{display:flex;gap:12px;padding:18px 0;flex-wrap:wrap}.step{border-right:1px solid var(--line);padding-right:18px}a{color:var(--green)}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:static;width:auto;padding:16px}.brand{font-size:25px}nav{display:flex;overflow:auto;margin-top:14px;gap:4px}nav button{white-space:nowrap;padding:8px}nav span,.asidefoot,aside .sub{display:none}main{margin:0;padding:0 16px 30px}.topbar{height:auto;min-height:65px;flex-wrap:wrap;padding:12px 0}.tools button{font-size:11px;padding:7px}.intro{padding:24px 0;display:block}.intro>button{margin-top:14px;white-space:nowrap}.sectionhead{flex-wrap:wrap;gap:8px} <script>
'use strict';
const KEY='wei-fashion-workbench-v1', stages=['接单','脚本','静态图','视频','剪辑','质检','交付'], modules=['客户与项目','商品资料','模特母图库','提示词生成器','分镜与脚本','质检清单','交付与成本'], categories=['女装','男装','户外冲锋衣','瑜伽服','童装','其他'], markets=['国内','欧美','中东','日本','其他'];
const uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date().toISOString().slice(0,10);
const qcDefs=[['正侧脸身份','正脸、左右侧脸轮廓与人物包一致'],['抬头／低头／帽子','可见五官稳定，帽檐自然，摘帽能接回身份'],['身高与体型','头身比、肩胯、腿长连续'],['皮肤材质','自然毛孔、轻微瑕疵，反光有差异'],['跨帧皮肤','痣、纹理与肤色不闪烁或游走'],['光影与接触','光向一致、脚落地、有接触阴影'],['头发与遮挡','发丝、耳朵、帽绳无融化穿透'],['肢体与动作','手指、关节、重心、转身连续'],['商品结构','领口、门襟、口袋、标志、袖口、下摆与真图一致'],['商品颜色与质感','对照原始色参考，褶皱垂坠可信'],['声音与口型','音色稳定、品牌词正确、嘴型同步'],['情境与事实','无虚构体验、价格和功能证据'],['发布与文件','字幕不挡商品、可播放、版本、AI声明与素材许可匹配']];
const seed={version:1,projects:[{id:'demo-p1',name:'秋冬上新 · 轻户外系列',client:'山野服饰（演示）',contact:'客户联系人待填写',market:'国内',channel:'抖音 / 视频号',due:'2026-11-08',budget:2800,rights:'待核验',rightsNote:'人物、商品、音乐及商用范围待客户确认',stage:'静态图',brief:'P1 基础包：4 张模特图 + 15–20 秒竖屏视频。先批准静态图，再做短动作。',qc:{},blockers:{},logs:[],files:[],confirmations:[],shots:[],released:false},{id:'demo-p2',name:'日常运动 · 英语样片',client:'Flow Active（演示）',market:'欧美',channel:'Instagram / TikTok',due:'2026-11-12',budget:3600,rights:'待核验',stage:'脚本',qc:{},blockers:{},logs:[],files:[],confirmations:[],shots:[]}],products:[{id:'demo-s1',project:'demo-p1',sku:'SKU-OUT-001',name:'轻户外连帽外套（演示）',category:'户外冲锋衣',color:'苔藓绿',material:'待客户提供成分表',size:'M；尺寸表待补充',structure:'连帽、正面拉链、两侧口袋；以客户原图核验',claims:[{text:'日常通勤与轻户外穿搭',evidence:false,source:''}],images:{}}],models:[{id:'demo-m1',code:'M001',version:'MP01',name:'林序（演示设定）',role:'原创成年虚拟人物，28 岁，语气自然',market:'国内',category:'户外冲锋衣',rights:'待核验；仅作档案示例',face:'椭圆脸、自然眉眼；鼻梁、耳形、下颌与眼距以批准参考为准',height:'168 cm；生成设定，不作为尺码证明',body:'固定肩胯关系、头身比及四肢比例；待全身参考批准',skin:'中性光自然肤色；色卡待批准',hair:'深棕色齐肩直发，固定发际线',makeup:'自然淡妆，保留皮肤纹理',detail:'保留细微不对称；痣与雀斑位置待参考确认',voice:'voice_id 待选；普通话；中音；自然节奏',voiceRights:'库存音色许可待确认；品牌词读音待客户确认',variants:'无已批准变体；一次只改一项并建子版本',forbidden:'禁止改骨相、眼距、身材比例和标志性皮肤特征',approval:'未批准；工具、模型版本、参考ID、设置、提示词、审批人及时间待登记',images:{}}]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}let page=0, selected=db.selected||db.projects[0]?.id||'',modelMarket='',modelCategory='';
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3300)}
function save(){db.selected=selected;try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saved').textContent='● 已保存 '+new Date().toLocaleTimeString('zh-CN');return true}catch{toast('保存失败：浏览器空间不足，请先导出备份并减小图片');return false}}
function p(){return db.projects.find(x=>x.id===selected)}
function opts(arr,value){return arr.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}
function field(label,key,value='',type='text',choices){return `<div class="field"><label for="f-${key}">${label}</label>${type==='textarea'?`<textarea id="f-${key}" name="${key}">${esc(value)}</textarea>`:type==='select'?`<select id="f-${key}" name="${key}">${opts(choices,value)}</select>`:`<input id="f-${key}" name="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''}>`}</div>`}
function head(title,desc,button=''){return `<div class="intro"><div><div class="sub" style="margin-bottom:9px">WEI / PRODUCTION WORKSPACE</div><h1>${title}</h1><p class="muted">${desc}</p></div>${button}</div>`}
function picker(){return `<div class="card row panel"><span>当前项目</span><select id="projectSelect" style="width:min(100%,360px)">${db.projects.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}
function openForm(title,body,submit){const m=document.getElementById('modal');m.innerHTML=`<form id="form"><div class="dialoghead"><h2>${title}</h2><button type="button" id="close">✕</button></div>${body}<div class="foot"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form>`;m.querySelector('#close').onclick=m.querySelector('#cancel').onclick=()=>m.close();m.querySelector('form').onsubmit=e=>{e.preventDefault();try{submit(Object.fromEntries(new FormData(e.target)));if(save()){m.close();render()}}catch(err){if(err)toast(err.message||String(err))}};m.showModal()}
function projectForm(id){const x=db.projects.find(v=>v.id===id)||{};openForm(id?'项目详情与编辑':'新建客户项目',`<div class="grid">${field('项目名称 *','name',x.name)}${field('客户 / 品牌 *','client',x.client)}${field('联系人与联系方式','contact',x.contact)}${field('目标市场','market',x.market||'国内','select',markets)}${field('发布渠道','channel',x.channel)}${field('交付日期','due',x.due||today(),'date')}${field('项目预算（人民币）','budget',x.budget||0,'number')}${field('授权状态','rights',x.rights||'待核验','select',['待核验','已授权','已过期／不可用'])}${field('项目状态','stage',x.stage||'接单','select',stages)}${field('授权范围 / 期限 / 独占 / 来源','rightsNote',x.rightsNote,'textarea')}<div class="wide">${field('需求、交付范围、修改轮次、静态图批准记录','brief',x.brief,'textarea')}</div></div>`,v=>{if(!v.name.trim()||!v.client.trim())throw toast('请填写项目名称和客户');if(v.stage==='交付'&&(x.stage!=='交付'||!releaseReady(x))) {v.stage=x.stage==='交付'?'质检':x.stage||'接单';toast('交付须在质检页完成放行');}Object.assign(x,v,{budget:Number(v.budget)});if(!x.id){Object.assign(x,{id:uid(),qc:{},blockers:{},logs:[],files:[],confirmations:[],shots:[]});db.projects.push(x);selected=x.id}invalidate(x)})}
function dashboard(){return head('每一条好视频，从这里开始。','把客户需求、人物、商品与交付，放在同一条生产线上。','<button class="primary" id="newProject">＋ 新建项目</button>')+`<div class="stats"><div class="stat"><span class="muted">进行中的项目</span><strong>${db.projects.filter(x=>x.stage!=='交付').length.toString().padStart(2,'0')}</strong><small>从接单到交付 · 全流程管理</small></div><div class="stat"><span class="muted">商品事实库</span><strong>${db.products.length.toString().padStart(2,'0')}</strong><small>真实 SKU 是制作依据</small></div><div class="stat"><span class="muted">人物身份包</span><strong>${db.models.length.toString().padStart(2,'0')}</strong><small>固定人物 · 按版本引用</small></div><div class="stat"><span class="muted">待核验授权</span><strong>${db.projects.filter(x=>x.rights!=='已授权').length.toString().padStart(2,'0')}</strong><small style="color:var(--red)">开工前确认使用范围</small></div></div><div class="sectionhead"><h2>项目生产看板 <span class="badge">${db.projects.length} 个项目</span></h2><span class="muted" style="font-size:12px">点击项目卡片编辑 · 交付需质检放行</span></div><div class="board">${stages.map((s,i)=>`<section class="lane"><header><span><i class="dot"></i>${String(i+1).padStart(2,'0')} ${s}</span><span>${db.projects.filter(x=>x.stage===s).length}</span></header>${db.projects.filter(x=>x.stage===s).map(x=>`<button class="project" data-project="${x.id}"><span class="badge">${esc(x.market)}</span><b>${esc(x.name)}</b><small>${esc(x.client)}</small><hr style="border:0;border-top:1px solid var(--line);margin:13px 0"><div class="row"><small>${esc(x.due||'交期待定')}</small><small style="color:${x.rights==='已授权'?'var(--green)':'var(--red)'}">${esc(x.rights)}</small></div></button>`).join('')||'<div class="empty">等待项目进入</div>'}</section>`).join('')}</div><div class="herofoot"><div class="card"><span class="sub">PRODUCTION PRINCIPLES</span><h2 style="margin-top:8px">先把人和衣服做对，再让画面动起来。</h2><div class="steps"><span class="step">01 人物身份包</span><span class="step">02 商品确认图</span><span class="step">03 单一短动作</span><span>04 逐镜验收</span></div><p class="muted">每镜回到批准母版；多角度展示不等于完整连续 360°。</p></div><div class="card"><span class="sub">YOUR LOCAL STUDIO</span><h3 style="margin-top:10px">资料留在你的浏览器里</h3><p class="muted">演示数据可直接编辑。定期导出 JSON，连同参考图一起备份。</p><span class="badge">无云端上传 · 无外部依赖</span></div></div>`}
const productFields=[['SKU *','sku'],['商品名称 *','name'],['品类','category','select',categories],['颜色 / 色号','color'],['材质 / 成分','material'],['尺码 / 尺寸表','size'],['领口、口袋、标志等关键结构','structure','textarea']];
function productForm(id){const x=db.products.find(v=>v.id===id)||{};openForm(id?'编辑商品事实':'新建商品',`<div class="grid">${productFields.map(([l,k,t,c])=>field(l,k,x[k]||'',t||'text',c)).join('')}<div class="field"><label>所属项目</label><select name="project">${db.projects.map(v=>`<option value="${v.id}" ${v.id===(x.project||selected)?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div></div>`,v=>{if(!v.sku.trim()||!v.name.trim())throw toast('请填写 SKU 和商品名称');Object.assign(x,v);if(!x.id){Object.assign(x,{id:uid(),claims:[],images:{}});db.products.push(x)}})}
function uploads(type,id,images,angles){return `<div class="gallery">${angles.map(a=>`<div class="upload">${esc(a)}${images?.[a]?`<img alt="${esc(a)}参考" src="${esc(images[a])}"><button data-remove="${type}|${id}|${a}">移除图片</button>`:'<div class="muted" style="padding:20px 0">＋ 参考图待补充</div>'}<input aria-label="上传${esc(a)}" type="file" accept="image/png,image/jpeg,image/webp" data-upload="${type}|${id}|${a}"></div>`).join('')}</div>`}

function generate(){const m=db.models.find(x=>x.id===document.getElementById('genModel').value),s=db.products.find(x=>x.id===document.getElementById('genProduct').value);if(!m||!s)return toast('请先建立人物和商品资料');const get=k=>document.getElementById('f-'+k).value,scene=get('scene'),action=get('action'),angle=get('angle'),kind=get('kind'),identity=`${m.code}/${m.version}`,facts=`SKU ${s.sku}；${s.category}；颜色 ${s.color}；材质 ${s.material}；结构 ${s.structure}`,enFacts=`SKU ${s.sku}; category: ${s.category}; color reference: ${s.color}; material: ${s.material}; verified construction notes (source language): ${s.structure}`;let zh='',en='';
const zbase=`唯一人物：${identity} ${m.name}。脸部：${m.face}。比例：${m.body}。身高：${m.height}。肤色：${m.skin}。发型：${m.hair}。妆容：${m.makeup}。皮肤：${m.detail}。\n`,ebase=`Use the approved identity package ${identity} (${m.name}) as the sole identity reference. Preserve facial anatomy, eye spacing, nose, lips, jaw, ears, hairline, skin marks and body proportions. Profile constraints in source language: ${m.face}; ${m.body}; ${m.height}; ${m.skin}; ${m.hair}; ${m.makeup}; ${m.detail}.\n`;
if(kind==='固定人物'){zh=`图1为批准正脸，图2为对应侧脸，图3为全身比例母版。${zbase}生成${angle}参考照；仅改变头部角度或指定姿势。保留基础服装、背景与柔光。自然皮肤纹理、细微不对称，禁止磨皮、广角拉伸。`;en=`Image 1: approved front face; image 2: matching profile; image 3: full-body proportions. ${ebase}Create ${angle}. Change only the requested angle or pose. Keep basic clothing, background and soft light. Natural skin texture and subtle asymmetry; no plastic skin or wide-angle distortion.`}
else if(kind==='只改服装区域'){zh=`图1–3：${identity}批准人物包；图4：真实商品正面；图5：背面；图6：细节。\n${zbase}${facts}。只编辑服装区域及必要接触阴影。脸、头发、身体、手脚、背景、构图和镜头保持不变。准确保留领型、门襟、口袋位置数量、缝线、标志和下摆。输出${angle}，不补造不可见结构，不为衣服改变体型。`;en=`Images 1–3: approved ${identity} identity package; image 4: actual product front; image 5: back; image 6: details. ${ebase}${enFacts}. Edit only the garment mask and necessary contact shadows. Preserve face, hair, body, hands, feet, background, composition and camera. Match collar, closure, pocket count and placement, seams, logo and hem exactly. Output ${angle}. Do not invent unseen construction or reshape the body to fit clothing.`}
else if(kind==='换背景'){zh=`图1：批准的 ${identity}/${s.sku} 穿衣图；图2：目标场景。${zbase}只把背景替换为${scene}。锁定服装结构与颜色、人物姿态、脸和身体。匹配原机位高度、透视和主光方向，只调整必要接触阴影、反射和边缘融合。不增加人物，不改标志或口袋。`;en=`Image 1: approved dressed still ${identity}/${s.sku}; image 2: target scene. ${ebase}Replace only the background with ${scene}. Lock garment construction, color, pose and identity. Match camera height, perspective and key-light direction. Adjust only necessary contact shadows, reflections and edge blending. Add no people; keep logos and pockets unchanged.`}
else if(kind==='多角度转身'||kind==='图生视频（可灵 / 即梦）'){zh=`图1：批准穿衣首帧 ${identity}/${s.sku}；图2：对应侧脸；图3：真实商品对应视角。${zbase}${facts}。固定机位、全身竖屏9:16、相同焦段观感与光线。场景：${scene}。动作：${action}。每段约3–5秒，仅一个动作，随后自然停住。保持服装结构和颜色；头发自然运动，皮肤不闪烁，不换脸、不瘦身、不增长腿部。不同时换景、换装、加口播。${kind==='多角度转身'?'分别制作正面、侧面、背面并批准后剪辑，只标多角度展示，不冒充连续360度。':'可灵/即梦使用批准静态图为首帧；支持时附侧脸或首尾帧，记录实际模型与设置。'}查首中尾及侧脸经过帧；连续两次失败时缩小动作或改剪辑。`;en=`Image 1: approved dressed first frame ${identity}/${s.sku}; image 2: matching profile; image 3: actual garment angle. ${ebase}${enFacts}. Locked camera, full-body 9:16 vertical framing, consistent focal-length appearance and lighting. Scene: ${scene}. Single action: ${action}. Use a short 3–5 second segment, then pause naturally. Preserve garment structure and color, natural hair motion and stable skin. No face replacement, slimming or leg elongation. Do not combine scene changes, outfit changes or speech. ${kind==='多角度转身'?'Approve front, side and back stills separately, then edit short clips as a multi-angle presentation, not a continuous 360-degree turn.':'For Kling/Jimeng, use an approved still as the first frame; attach profile or end frame if available. Record actual model and settings.'}Inspect first, middle, final and profile-transition frames. After two failures, reduce motion or change the edit.`}
else{const line=get('line').trim()||'今天看看这款服装的正面、侧面和背面。';const proven=s.claims.filter(c=>c.evidence&&c.source.trim()).map(c=>c.text+'（'+c.source+'）').join('；');zh=`${zbase}正面半身，目视镜头，嘴部无遮挡，轻微点头，双手放松，固定机位。\n台词（客户确认后使用）：“${line}”\n仅可参考已记录证据的卖点：${proven||'暂无，不加入功能卖点'}。不虚构体验、价格、尺码或性能。\n配音：${m.voice}。许可与读音：${m.voiceRights}。先听音轨确认品牌、尺码与数字，再做口型；转身与背面用旁白。AI身份需声明。`;en=`${ebase}Front-facing medium shot, looking at camera, mouth unobstructed, subtle nods, relaxed hands, locked camera.\nSpeak this client-approved script in its written language (do not invent a translation): “${line}”\nEvidence-backed claims only: ${proven||'none; make no performance claims'}. Do not invent experiences, pricing, size fit or performance.\nVoice profile: ${m.voice}. License and pronunciation notes: ${m.voiceRights}. Approve the final audio and brand/size/number pronunciations before lip sync. Use voiceover for back views and turns. Disclose AI production.`}

 const types=['主视觉','正面全身','侧面全身','背面全身','走动全身','换装对比','单人留白海报（文字区留白）','面料特写'];const suite=c.mode==='套图'?types.map(title=>({title,text:zh+`\n本张用途：${title}。${title.includes('留白')?'单人构图，预留干净文字区，不生成文字。':title==='换装对比'?'相同人物、动作、机位、光线和构图，只有指定服装不同。':title==='面料特写'?'准确展示商品真实织纹，不虚构功能效果。':'以对应已批准视角为依据；各视角分别使用相应母版，换装前后保持该母版动作与构图一致。'}`})):[];
 const g=p().generator;g.result={zh,en,suite};g.history.push({version:(g.history.at(-1)?.version||0)+1,time:new Date().toLocaleString('zh-CN'),config:structuredClone(c),result:structuredClone(g.result)});save();render();toast('已生成并保存项目历史版本')};
const originalUploads=uploads;
uploads=function(type,id,images,angles){const x=db[type].find(x=>x.id===id);x.imageMeta ||= {};return originalUploads(type,id,images,angles).replace(/<div class="upload">([^<]+)/g,(full,label)=>{const a=label.replaceAll('&amp;','&');const meta=x.imageMeta[a]||{};return full+`<div class="field"><label>参考用途</label><select aria-label="${esc(a)}参考用途" data-meta="${type}|${id}|${esc(a)}|use">${opts(['身份参考','多角度设定','商品结构','首帧','场景参考','样片参考'],meta.use||(a==='多角度设定图'?'多角度设定':'身份参考'))}</select><label>图片来源</label><select aria-label="${esc(a)}图片来源" data-meta="${type}|${id}|${esc(a)}|source">${opts(['来源待核验','样片截图','客户原图','生成示意'],meta.source||'来源待核验')}</select><label>可信级别</label><select aria-label="${esc(a)}可信级别" data-meta="${type}|${id}|${esc(a)}|trust">${opts(['待核验','仅供参考','已核验正式依据'],meta.trust||'待核验')}</select></div>`})};
const originalProducts=products,originalModels=models;
products=function(){return originalProducts().replaceAll('商品原图','商品图片（按来源和可信级别使用）')};
models=function(){return originalModels()+`<div class="card"><h3>人物项目绑定</h3>${db.models.map(x=>`<p>${esc(x.name)}：${(x.projects||[]).map(id=>esc(db.projects.find(p=>p.id===id)?.name||id)).join('、')||'未绑定项目（编辑完整档案可绑定）'}</p>`).join('')}</div>`};
function frameAssets(){const assets=[];for(const type of ['models','products','projects'])for(const x of db[type]){if(type==='models'?!x.projects?.includes(selected):type==='products'?x.project!==selected:x.id!==selected)continue;for(const [angle,src] of Object.entries(x.images||{}))assets.push({key:JSON.stringify([type,x.id,angle]),src,label:`${x.name} / ${angle}`,meta:x.imageMeta?.[angle]||{}})}return assets}
shotForm=function(id){const project=p(),x=project.shots.find(s=>s.id===id)||{},assets=frameAssets();openForm(id?'编辑镜头':'新增镜头',`<div class="grid">${field('镜号','number',x.number||project.shots.length+1,'number')}${field('时长（秒）','duration',x.duration??4,'number')}${field('所属视频 / 文件版本','video',x.video||'主片 v01')}${field('状态','status',x.status||'待制作','select',['待制作','制作中','待审核','已批准','返修'])}<div class="wide field"><label for="frameSelect">首帧：模特母图库 / 项目图片 / 项目商品图</label><select id="frameSelect" name="frame"><option value="">未绑定首帧</option>${assets.map(a=>`<option value="${esc(a.key)}" ${x.frame===a.key?'selected':''}>${esc(a.label)} · ${esc(a.meta.source||'来源待核验')} / ${esc(a.meta.trust||'待核验')}</option>`).join('')}</select><div id="framePreview"></div></div>${field('首帧批准状态','frameApproval',x.frameApproval||'待定','select',['待定','已批准','需重做'])}${field('首帧版本号','frameVersion',x.frameVersion||'v01')}${field('画面 / 旧批准首帧ID（保留）','visual',x.visual,'textarea')}${field('单一动作','action',x.action,'textarea')}${field('台词 / 旁白','line',x.line,'textarea')}${field('音轨 / BGM / 配音备注','audio',x.audio,'textarea')}${field('字幕备注','subtitle',x.subtitle,'textarea')}${field('可灵任务状态','task',x.task||'未提交','select',['未提交','生成中','已完成','废弃'])}${field('成片链接（仅记录地址）','output',x.output)}${field('使用的提示词 / 模型 / 实际设置','prompt',x.prompt,'textarea')}</div>`,v=>{if(!Number.isFinite(Number(v.duration))||Number(v.duration)<=0)throw Error('镜头时长须大于 0');Object.assign(x,v);if(!x.id){x.id=uid();project.shots.push(x)}});const preview=()=>{const a=assets.find(a=>a.key===document.getElementById('frameSelect').value);document.getElementById('framePreview').innerHTML=a?`<img class="thumb" alt="首帧预览" src="${esc(a.src)}">`:'未绑定首帧'};document.getElementById('frameSelect').onchange=preview;preview()};
function timecode(s){const ms=Math.round(Number(s)*1000);return `${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(ms%1000).padStart(3,'0')}`}
scripts=function(){const x=p();if(!x)return head('分镜与脚本','请先新建项目')+picker();let elapsed=0;const assets=frameAssets();return head('分镜与脚本','每镜绑定首帧、版本与批准状态；仅记录视频地址，不下载视频。')+picker()+`<div class="sectionhead"><h2>${esc(x.name)} <span class="badge">${x.shots.length} 镜 · ${x.shots.reduce((s,a)=>s+Number(a.duration),0)} 秒</span></h2><div class="tools"><button id="templateShots">添加基础脚本</button><button class="primary" id="newShot">＋ 新增镜头</button></div></div><div class="shotcards">${x.shots.map(s=>{const start=elapsed;elapsed+=Number(s.duration)||0;const a=assets.find(a=>a.key===s.frame);return `<section class="card"><div class="row"><h2>镜 ${esc(s.number)} · ${esc(s.video)}</h2><span class="badge">${timecode(start)} → ${timecode(elapsed)} · ${esc(s.duration)} 秒 · 累计 ${elapsed.toFixed(3)} 秒</span></div><div class="grid" style="margin-top:16px"><div>${a?`<img class="thumb" alt="镜头首帧" src="${esc(a.src)}"><p>${esc(a.label)}</p>`:`<p class="muted">${s.frame?'原首帧已移除，请重新绑定':'未绑定首帧'}</p>`}<span class="tag">${esc(s.frameApproval||'待定')} · ${esc(s.frameVersion||'v01')}</span><p>${esc(s.visual)}</p><p>动作：${esc(s.action)}</p><p>台词：${esc(s.line)}</p></div><div><p>音轨：${esc(s.audio||'待补充')}</p><p>字幕：${esc(s.subtitle||'待补充')}</p><p>可灵任务：${esc(s.task||'未提交')}</p><p>成片链接：${safeLink(s.output)}</p><details><summary>提示词 / 模型 / 设置</summary><p class="prompt">${esc(s.prompt)}</p></details></div></div><div class="foot"><span class="badge">${esc(s.status)}</span><button data-shot="${s.id}">编辑</button><button data-delshot="${s.id}">删除</button></div></section>`}).join('')||'<div class="empty">点击添加基础脚本或新增镜头。</div>'}</div><div class="card panel" style="margin-top:20px"><h3>项目图片（可直接选作首帧）</h3>${uploads('projects',x.id,x.images,['项目首帧1','项目首帧2','项目首帧3','项目首帧4','多角度设定图'])}</div>`};
function safeLink(url){return /^https?:\/\//i.test(url||'')?`<a target="_blank" rel="noopener" href="${esc(url)}">${esc(url)}</a>`:esc(url||'待补充')}
releaseReady=function(x){return x&&qcDefs.every((_,i)=>x.qc?.[i]?.status==='通过'||(x.qc?.[i]?.status==='不适用'&&x.qc[i].note?.trim()))&&!blockerNames.some((_,i)=>x.blockers?.[i])&&x.rights==='已授权'};
const originalQuality=quality;
quality=function(){return originalQuality().replace(/<input aria-label="([^"]+)通过" type="checkbox" data-qc="(\d+)"[^>]*>/g,(_,name,i)=>`<select aria-label="${name}检查状态" data-qc="${i}">${opts(['通过','待检','不适用'],p().qc[i]?.status||'待检')}</select>`).replace('13 项通过、无不可放行问题','13 项通过或有说明的不适用、无不可放行问题')};
const originalCosts=costs;
function totals(logs){return costStates.map(state=>({state,amounts:Object.fromEntries(currencies.map(cur=>[cur,logs.filter(l=>l.state===state&&l.currency===cur).reduce((n,l)=>n+Number(l.cost||0),0)]))}))}
function moneyText(amounts,divisor=1){return currencies.map(c=>`${c} ${(amounts[c]/divisor).toFixed(2)}`).join(' / ')}
costs=function(){if(!p())return originalCosts();const x=p();let html=originalCosts();const stats=`<div class="stats">${totals(x.logs).map(t=>`<div class="stat"><h3>${t.state}</h3><p>${moneyText(t.amounts)}</p><small>按币种独立合计，不混加外币</small></div>`).join('')}</div><p class="notice">项目预算：CNY ${Number(x.budget||0).toFixed(2)}；旧流水按估算迁移，需逐项确认性质。</p>`;html=html.replace(/<div class="stats">[\s\S]*?<div class="card panel">/,stats+'<div class="card panel">');html=html.replace('花费（元）','金额 / 币种 / 状态').replace('${esc(a.cost)}','');html=html.replace(/<td>([^<]*)<\/td><td>([^<]*)<\/td><td>([^<]*)<\/td><td>([^<]*)<\/td><td><button data-delete="logs\|([^\"]+)"/g,(full,count,cost,hours,note,id)=>{const l=x.logs.find(a=>a.id===id);return `<td>${count}</td><td>${esc(l.cost)} ${esc(l.currency)}<br>${esc(l.state)}</td><td>${hours}</td><td>${note}</td><td><button data-cost="${esc(id)}">编辑</button><button data-delete="logs|${esc(id)}"`});html=html.replace('报价 = 完整成本','估算报价 = 所有状态成本之和').replace(/<b id="quote">[^<]*<\/b>/,'<b id="quote"></b>');return html};
function quote(){const el=document.getElementById('quote');if(!el)return;const n=Number(document.getElementById('margin').value),amounts=Object.fromEntries(currencies.map(c=>[c,p().logs.filter(l=>l.currency===c).reduce((n,l)=>n+Number(l.cost||0),0)]));el.textContent=n>=0&&n<100?'估算 '+moneyText(amounts,1-n/100):'请输入 0–99'}
function costForm(id){const x=p().logs.find(l=>l.id===id)||{};openForm('记录成本（按状态和币种独立统计）',`<div class="grid">${field('日期','date',x.date||today(),'date')}${field('工具 / 人工 / 授权 / 分摊','tool',x.tool)}${field('生成次数（含重试）','count',x.count??1,'number')}${field('金额','cost',x.cost??0,'number')}${field('金额状态','state',x.state||'估算','select',costStates)}${field('币种','currency',x.currency||'CNY','select',currencies)}${field('工时','hours',x.hours??0,'number')}${field('备注 / 账单依据','note',x.note,'textarea')}</div>`,v=>{Object.assign(x,v);if(!x.id){x.id=uid();p().logs.push(x)}})}
const originalBind=bind;
bind=function(){originalBind();if(page===3&&p()){for(const [key,value] of Object.entries(config())){const el=document.getElementById(['genModel','genProduct'].includes(key)?key:'f-'+key);if(el)el.value=value}document.querySelectorAll('#app input,#app textarea,#app select:not(#projectSelect)').forEach(el=>{el.addEventListener('input',captureConfig);el.addEventListener('change',captureConfig)});on('f-plan',()=>{const [scene,light,composition]=plans[document.getElementById('f-plan').value];for(const [key,value] of Object.entries({scene,light,composition})){document.getElementById('f-'+key).value=value}captureConfig()},'change');displayResult();document.querySelectorAll('[data-history]').forEach(e=>e.onclick=()=>{const h=p().generator.history[Number(e.dataset.history)];p().generator.config=structuredClone(h.config);p().generator.result=structuredClone(h.result);save();render();toast('已恢复历史版本')})}
 document.querySelectorAll('[data-meta]').forEach(el=>el.onchange=()=>{const [type,id,a,key]=el.dataset.meta.split('|');const x=db[type].find(x=>x.id===id);x.imageMeta[a] ||= {};x.imageMeta[a][key]=el.value;save()});
 document.querySelectorAll('[data-qc]').forEach(el=>el.onchange=()=>{const x=p(),i=el.dataset.qc;x.qc[i]={...x.qc[i],status:el.value,pass:el.value==='通过',time:new Date().toLocaleString('zh-CN')};invalidate(x);save();render()});
 document.querySelectorAll('[data-qcnote]').forEach(el=>{el.onchange=null;el.oninput=()=>{const x=p(),i=el.dataset.qcnote;x.qc[i]={...x.qc[i],note:el.value,status:'待检',pass:false,time:new Date().toLocaleString('zh-CN')};const status=document.querySelector(`[data-qc="${i}"]`);status.value='待检';invalidate(x);save();const counter=document.querySelector('.card .row .badge');if(counter)counter.textContent=`${Object.values(x.qc).filter(a=>a.status==='通过').length} / 13 通过`;const notice=document.querySelector('.notice');if(notice){notice.textContent='说明已更新，请复查并重新选择通过或不适用。';notice.classList.add('danger')}}});
 const newCost=document.getElementById('newCost');if(newCost)newCost.onclick=()=>costForm();document.querySelectorAll('[data-cost]').forEach(el=>el.onclick=()=>costForm(el.dataset.cost));const margin=document.getElementById('margin');if(margin){margin.oninput=quote;quote()}
};
function validateV2(data){if(!data||![1,2].includes(data.version))throw Error('备份版本不支持');for(const key of ['projects','models','products'])if(!Array.isArray(data[key]))throw Error('缺少 '+key);const ids=new Set();for(const type of ['projects','models','products'])for(const x of data[type]){if(!x||typeof x.id!=='string'||ids.has(x.id))throw Error('记录编号无效或重复');ids.add(x.id);for(const src of Object.values(x.images||{}))if(typeof src!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src))throw Error('图片必须是本地 base64 数据');if(type==='projects'){if(!stages.includes(x.stage))throw Error('项目状态无效');for(const key of ['shots','logs','files','confirmations'])if(!Array.isArray(x[key]))throw Error('项目明细无效');for(const l of x.logs)for(const f of ['cost','count','hours'])if(!Number.isFinite(Number(l[f]))||Number(l[f])<0)throw Error('成本金额无效');if(!Number.isFinite(Number(x.budget))||Number(x.budget)<0)throw Error('预算无效')}}return migrate(data)}
function projectPackage(){const x=p();return {version:2,kind:'project',selected,projects:[structuredClone(x)],products:structuredClone(db.products.filter(s=>s.project===selected)),models:structuredClone(projectModels())}}
function download(data,name){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name+'-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const exportProject=document.createElement('button');exportProject.id='exportProject';exportProject.textContent='↓ 导出当前项目';document.getElementById('export').before(exportProject);exportProject.onclick=()=>{if(!p())return toast('请先选择项目');save();download(projectPackage(),'Wei单项目');toast('已打包当前项目及关联资产')};
on('export',()=>{save();download(db,'Wei工作台备份');toast('已导出全部记录、所选项目与生成配置')});on('import',()=>document.getElementById('backup').click());
on('backup',async e=>{const f=e.target.files[0];if(!f)return;try{const data=validateV2(JSON.parse(await f.text()));openForm('导入备份',`<p>包含 ${data.projects.length} 个项目、${data.models.length} 个人物、${data.products.length} 个商品。</p>${field('导入方式','importMode','合并（同编号更新，其他记录保留）','select',['合并（同编号更新，其他记录保留）','替换全部（先备份当前数据）'])}`,v=>{const old=db,oldSelected=selected;let next;if(v.importMode.startsWith('合并')){next=structuredClone(db);for(const key of ['projects','models','products'])for(const incoming of data[key]){const index=next[key].findIndex(x=>x.id===incoming.id);const row=structuredClone(incoming);if(key==='models'&&index>=0)row.projects=[...new Set([...(next[key][index].projects||[]),...(row.projects||[])])];if(index>=0)next[key][index]=row;else next[key].push(row)}next.selected=data.selected}else next=structuredClone(data);db=migrate(next);selected=db.selected;db.projects.forEach(invalidate);if(!save()){db=old;selected=oldSelected;throw Error('导入保存失败，已恢复原数据')}toast('导入完成')})}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}},'change');
const originalProjectForm=projectForm;
projectForm=function(id){if(id){selected=id;save()}originalProjectForm(id)};
const originalRender=render;
render=function(){migrate(db);originalRender()};
save();render();

</script></body></html>
