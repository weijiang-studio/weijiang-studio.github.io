ong{font-size:30px;display:block;margin:5px 0}.stat small{font-size:11px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:22px 0 16px}.board{display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:12px;overflow-x:auto;padding-bottom:12px}.lane{background:#eeefe8;border-radius:9px;padding:12px;min-height:280px}.lane header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:16px}.project{display:block;width:100%;text-align:left;padding:15px 12px;margin-bottom:10px;border-radius:8px;box-shadow:0 2px 4px #00000003}.project b{display:block;margin:8px 0}.project small{font-size:11px}.dot{height:7px;width:7px;display:inline-block;background:#a3b19b;border-radius:50%;margin-right:6px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.panel{margin-bottom:20px}.field{display:flex;flex-direction:column;gap:6px;margin:0 0 15px}.field label{font-size:12px;color:#626d62}input,select,textarea{width:100%;padding:10px 11px;background:#fcfcf9;border:1px solid #dfe3d9;border-radius:6px;color:var(--ink)}textarea{min-height:95px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #a9bda2;outline-offset:1px}.wide{grid-column:1/-1}.notice{background:var(--pale);color:var(--green);border-radius:8px;padding:14px 18px;margin:16px 0}.danger{color:var(--red);background:#fcf0eb}.listcard{margin-bottom:14px}.tag{display:inline-block;font-size:11px;border:1px solid var(--line);padding:2px 8px;border-radius:4px;margin:3px 4px 3px 0}.empty{font-size:12px;color:var(--muted);text-align:center;padding:30px 8px;border:1px dashed #d8ddcf;border-radius:7px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.upload{border:1px dashed #cdd6c8;padding:12px;border-radius:8px;text-align:center;font-size:12px}.upload img{width:100%;height:110px;object-fit:contain;display:block;margin:10px 0}.upload input{font-size:10px;padding:5px}.prompt{white-space:pre-wrap;line-height:1.9;font-size:13px;min-height:210px}.check{display:flex;gap:12px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line)}.check input{width:18px;height:18px;margin-top:5px}.check .body{flex:1}.check p{font-size:12px}.check input[type=text]{width:100%;margin-top:8px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500}.tablewrap{overflow:auto}dialog{border:1px solid var(--line);border-radius:12px;width:700px;max-width:94vw;padding:26px;max-height:90vh;overflow:auto}dialog::backdrop{background:#202a215e;backdrop-filter:blur(3px)}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}#toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#29392c;color:white;padding:12px 24px;border-radius:8px;z-index:10;display:none}.herofoot{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:22px}.steps{display:flex;gap:12px;padding:18px 0;flex-wrap:wrap}.step{border-right:1px solid var(--line);padding-right:18px}a{color:var(--green)}@media(max-width:1050px){.stats{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(2,1fr)}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){aside{position:static;width:auto;padding:16px}.brand{font-size:25px}nav{display:flex;overflow:auto;margin-top:14px;gap:4px}nav button{white-space:nowrap;padding:8px}nav span,.asidefoot,aside .sub{display:none}main{margin:0;padding:0 16px 30px}.topbar{height:auto;min-height:65px;flex-wrap:wrap;padding:12px 0}.tools button{font-size:11px;padding:7px}.intro{padding:24px 0;display:block}.intro>button{margin-top:14px;white-space:nowrap}.sectionhead{flex-wrap:wrap;gap:8px} </style><body><aside><div class="brand">Wei<span style="color:#8e9c86">.</span> <i>Studio</i></div><div class="sub">AI COMMERCE VISUALS</div><nav id="nav"></nav><div class="asidefoot">固定一个可信的人<br>讲清楚每一件真实商品。<p style="margin-top:20px">● 本地工作空间 · Wei<br><span style="font-size:10px">AI 服装视频工作台 / V1.0</span></p></div></aside><main><div class="topbar"><span class="muted">工作空间 <span style="margin:0 10px">/</span> <b id="crumb"></b></span><div class="tools"><span class="badge" id="saved">● 本地自动保存</span><button id="export">↓ 导出备份</button><button id="import">↑ 导入</button><input type="file" id="backup" accept="application/json" hidden></div></div><div id="app"></div></main><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='wei-fashion-workbench-v1', stages=['接单','脚本','静态图','视频','剪辑','质检','交付'], modules=['客户与项目','商品资料','模特母图库','提示词生成器','分镜与脚本','质检清单','交付与成本'], categories=['女装','男装','户外冲锋衣','瑜伽服','童装','其他'], markets=['国内','欧美','中东','日本','其他'];
const uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date().toISOString().slice(0,10);
const qcDefs=[['正侧脸身份','正脸、左右侧脸轮廓与人物包一致'],['抬头／低头／帽子','可见五官稳定，帽檐自然，摘帽能接回身份'],['身高与体型','头身比、肩胯、腿长连续'],['皮肤材质','自然毛孔、轻微瑕疵，反光有差异'],['跨帧皮肤','痣、纹理与肤色不闪烁或游走'],['光影与接触','光向一致、脚落地、有接触阴影'],['头发与遮挡','发丝、耳朵、帽绳无融化穿透'],['肢体与动作','手指、关节、重心、转身连续'],['商品结构','领口、门襟、口袋、标志、袖口、下摆与真图一致'],['商品颜色与质感','对照原始色参考，褶皱垂坠可信'],['声音与口型','音色稳定、品牌词正确、嘴型同步'],['情境与事实','无虚构体验、价格和功能证据'],['发布与文件','字幕不挡商品、可播放、版本、AI声明与素材许可匹配']];
const seed={version:1,projects:[{id:'demo-p1',name:'秋冬上新 · 轻户外系列',client:'山野服饰（演示）',contact:'客户联系人待填写',market:'国内',channel:'抖音 / 视频号',due:'2026-11-08',budget:2800,rights:'待核验',rightsNote:'人物、商品、音乐及商用范围待客户确认',stage:'静态图',brief:'P1 基础包：4 张模特图 + 15–20 秒竖屏视频。先批准静态图，再做短动作。',qc:{},blockers:{},logs:[],files:[],confirmations:[],shots:[],released:false},{id:'demo-p2',name:'日常运动 · 英语样片',client:'Flow Active（演示）',market:'欧美',channel:'Instagram / TikTok',due:'2026-11-12',budget:3600,rights:'待核验',stage:'脚本',qc:{},blockers:{},logs:[],files:[],confirmations:[],shots:[]}],products:[{id:'demo-s1',project:'demo-p1',sku:'SKU-OUT-001',name:'轻户外连帽外套（演示）',category:'户外冲锋衣',color:'苔藓绿',material:'待客户提供成分表',size:'M；尺寸表待补充',structure:'连帽、正面拉链、两侧口袋；以客户原图核验',claims:[{text:'日常通勤与轻户外穿搭',evidence:false,source:''}],images:{}}],models:[{id:'demo-m1',code:'M001',version:'MP01',name:'林序（演示设定）',role:'原创成年虚拟人物，28 岁，语气自然',market:'国内',category:'户外冲锋衣',rights:'待核验；仅作档案示例',face:'椭圆脸、自然眉眼；鼻梁、耳形、下颌与眼距以批准参考为准',height:'168 cm；生成设定，不作为尺码证明',body:'固定肩胯关系、头身比及四肢比例；待全身参考批准',skin:'中性光自然肤色；色卡待批准',hair:'深棕色齐肩直发，固定发际线',makeup:'自然淡妆，保留皮肤纹理',detail:'保留细微不对称；痣与雀斑位置待参考确认',voice:'voice_id 待选；普通话；中音；自然节奏',voiceRights:'库存音色许可待确认；品牌词读音待客户确认',variants:'无已批准变体；一次只改一项并建子版本',forbidden:'禁止改骨相、眼距、身材比例和标志性皮肤特征',approval:'未批准；工具、模型版本、参考ID、设置、提示词、审批人及时间待登记',images:{}}]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)}let page=0, selected=db.projects[0]?.id||'',modelMarket='',modelCategory='';
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',3300)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saved').textContent='● 已保存 '+new Date().toLocaleTimeString('zh-CN');return true}catch{toast('保存失败：浏览器空间不足，请先导出备份并减小图片');return false}}
function p(){return db.projects.find(x=>x.id===selected)}
function opts(arr,value){return arr.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}
function field(label,key,value='',type='text',choices){return `<div class="field"><label for="f-${key}">${label}</label>${type==='textarea'?`<textarea id="f-${key}" name="${key}">${esc(value)}</textarea>`:type==='select'?`<select id="f-${key}" name="${key}">${opts(choices,value)}</select>`:`<input id="f-${key}" name="${key}" type="${type}" value="${esc(value)}" ${type==='number'?'min="0" step="0.01"':''}>`}</div>`}
function head(title,desc,button=''){return `<div class="intro"><div><div class="sub" style="margin-bottom:9px">WEI / PRODUCTION WORKSPACE</div><h1>${title}</h1><p class="muted">${desc}</p></div>${button}</div>`}
function picker(){return `<div class="card row panel"><span>当前项目</span><select id="projectSelect" style="width:min(100%,360px)">${db.projects.map(x=>`<option value="${x.id}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`}
function openForm(title,body,submit){const m=document.getElementById('modal');m.innerHTML=`<form id="form"><div class="dialoghead"><h2>${title}</h2><button type="button" id="close">✕</button></div>${body}<div class="foot"><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form>`;m.querySelector('#close').onclick=m.querySelector('#cancel').onclick=()=>m.close();m.querySelector('form').onsubmit=e=>{e.preventDefault();try{submit(Object.fromEntries(new FormData(e.target)));if(save()){m.close();render()}}catch(err){if(err)toast(err.message||String(err))}};m.showModal()}
function projectForm(id){const x=db.projects.find(v=>v.id===id)||{};openForm(id?'项目详情与编辑':'新建客户项目',`<div class="grid">${field('项目名称 *','name',x.name)}${field('客户 / 品牌 *','client',x.client)}${field('联系人与联系方式','contact',x.contact)}${field('目标市场','market',x.market||'国内','select',markets)}${field('发布渠道','channel',x.channel)}${field('交付日期','due',x.due||today(),'date')}${field('项目预算（人民币）','budget',x.budget||0,'number')}${field('授权状态','rights',x.rights||'待核验','select',['待核验','已授权','已过期／不可用'])}${field('项目状态','stage',x.stage||'接单','select',stages)}${field('授权范围 / 期限 / 独占 / 来源','rightsNote',x.rightsNote,'textarea')}<div class="wide">${field('需求、交付范围、修改轮次、静态图批准记录','brief',x.brief,'textarea')}</div></div>`,v=>{if(!v.name.trim()||!v.client.trim())throw toast('请填写项目名称和客户');if(v.stage==='交付'&&(x.stage!=='交付'||!releaseReady(x))) {v.stage=x.stage==='交付'?'质检':x.stage||'接单';toast('交付须在质检页完成放行');}Object.assign(x,v,{budget:Number(v.budget)});if(!x.id){Object.assign(x,{id:uid(),qc:{},blockers:{},logs:[],files:[],confirmations:[],shots:[]});db.projects.push(x);selected=x.id}invalidate(x)})}
function dashboard(){return head('每一条好视频，从这里开始。','把客户需求、人物、商品与交付，放在同一条生产线上。','<button class="primary" id="newProject">＋ 新建项目</button>')+`<div class="stats"><div class="stat"><span class="muted">进行中的项目</span><strong>${db.projects.filter(x=>x.stage!=='交付').length.toString().padStart(2,'0')}</strong><small>从接单到交付 · 全流程管理</small></div><div class="stat"><span class="muted">商品事实库</span><strong>${db.products.length.toString().padStart(2,'0')}</strong><small>真实 SKU 是制作依据</small></div><div class="stat"><span class="muted">人物身份包</span><strong>${db.models.length.toString().padStart(2,'0')}</strong><small>固定人物 · 按版本引用</small></div><div class="stat"><span class="muted">待核验授权</span><strong>${db.projects.filter(x=>x.rights!=='已授权').length.toString().padStart(2,'0')}</strong><small style="color:var(--red)">开工前确认使用范围</small></div></div><div class="sectionhead"><h2>项目生产看板 <span class="badge">${db.projects.length} 个项目</span></h2><span class="muted" style="font-size:12px">点击项目卡片编辑 · 交付需质检放行</span></div><div class="board">${stages.map((s,i)=>`<section class="lane"><header><span><i class="dot"></i>${String(i+1).padStart(2,'0')} ${s}</span><span>${db.projects.filter(x=>x.stage===s).length}</span></header>${db.projects.filter(x=>x.stage===s).map(x=>`<button class="project" data-project="${x.id}"><span class="badge">${esc(x.market)}</span><b>${esc(x.name)}</b><small>${esc(x.client)}</small><hr style="border:0;border-top:1px solid var(--line);margin:13px 0"><div class="row"><small>${esc(x.due||'交期待定')}</small><small style="color:${x.rights==='已授权'?'var(--green)':'var(--red)'}">${esc(x.rights)}</small></div></button>`).join('')||'<div class="empty">等待项目进入</div>'}</section>`).join('')}</div><div class="herofoot"><div class="card"><span class="sub">PRODUCTION PRINCIPLES</span><h2 style="margin-top:8px">先把人和衣服做对，再让画面动起来。</h2><div class="steps"><span class="step">01 人物身份包</span><span class="step">02 商品确认图</span><span class="step">03 单一短动作</span><span>04 逐镜验收</span></div><p class="muted">每镜回到批准母版；多角度展示不等于完整连续 360°。</p></div><div class="card"><span class="sub">YOUR LOCAL STUDIO</span><h3 style="margin-top:10px">资料留在你的浏览器里</h3><p class="muted">演示数据可直接编辑。定期导出 JSON，连同参考图一起备份。</p><span class="badge">无云端上传 · 无外部依赖</span></div></div>`}
const productFields=[['SKU *','sku'],['商品名称 *','name'],['品类','category','select',categories],['颜色 / 色号','color'],['材质 / 成分','material'],['尺码 / 尺寸表','size'],['领口、口袋、标志等关键结构','structure','textarea']];
function productForm(id){const x=db.products.find(v=>v.id===id)||{};openForm(id?'编辑商品事实':'新建商品',`<div class="grid">${productFields.map(([l,k,t,c])=>field(l,k,x[k]||'',t||'text',c)).join('')}<div class="field"><label>所属项目</label><select name="project">${db.projects.map(v=>`<option value="${v.id}" ${v.id===(x.project||selected)?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div></div>`,v=>{if(!v.sku.trim()||!v.name.trim())throw toast('请填写 SKU 和商品名称');Object.assign(x,v);if(!x.id){Object.assign(x,{id:uid(),claims:[],images:{}});db.products.push(x)}})}
function uploads(type,id,images,angles){return `<div class="gallery">${angles.map(a=>`<div class="upload">${esc(a)}${images?.[a]?`<img alt="${esc(a)}参考" src="${esc(images[a])}"><button data-remove="${type}|${id}|${a}">移除图片</button>`:'<div class="muted" style="padding:20px 0">＋ 参考图待补充</div>'}<input aria-label="上传${esc(a)}" type="file" accept="image/png,image/jpeg,image/webp" data-upload="${type}|${id}|${a}"></div>`).join('')}</div>`}
function products(){return head('商品资料','建立真实商品事实库，未经证实的卖点不会进入口播。','<button class="primary" id="newProduct">＋ 新建商品</button>')+db.products.map(x=>`<section class="card panel"><div class="row"><div><span class="sub">${esc(x.sku)}</span><h2>${esc(x.name)}</h2><p class="muted">${esc(x.category)} · ${esc(x.color)} · ${esc(db.projects.find(y=>y.id===x.project)?.name||'未关联项目')}</p></div><button data-product="${x.id}">编辑资料</button></div><div class="steps"><span>材质：${esc(x.material)}</span><span>尺码：${esc(x.size)}</span></div><p>${esc(x.structure)}</p><div class="sectionhead"><h3>卖点与证据</h3><button data-claim="${x.id}">＋ 添加卖点</button></div>${x.claims.map((c,i)=>`<div class="row listcard"><span><span class="badge ${c.evidence?'':'danger'}">${c.evidence?'有证据':'待补证'}</span> ${esc(c.text)} <small>${esc(c.source)}</small></span><button data-delclaim="${x.id}|${i}">删除</button></div>`).join('')||'<p class="muted">暂无卖点；请记录来源后再用于功能宣传。</p>'}<h3 style="margin-top:20px">商品原图 <small>真实原图为依据，生成图不能替代证据</small></h3>${uploads('products',x.id,x.images,['正面','背面','左侧','右侧','细节'])}</section>`).join('')||''}

function prompts(){return head('提示词生成器','同一意图，中英双语。根据 brand_plan §3、§6 与 guide §3 的模板生成。')+`<div class="grid"><div class="card"><h2>配置一次，固定制作依据</h2><div style="margin-top:20px">${entitySelect('人物与身份版本','genModel',db.models)}${entitySelect('真实商品','genProduct',db.products)}${field('场景（可直接填写英文，便于英语输出）','scene','中性光摄影棚 / neutral-light studio')}${field('单一动作（可直接填写英文）','action','缓慢转向自身左侧约45度后停住 / slowly turn 45 degrees toward own left, then pause')}${field('输出视角','angle','正面 / front view','select',['正面 / front view','自身左90度 / own left profile','自身右90度 / own right profile','背面 / back view','抬头 / looking up','低头 / looking down'])}${field('模板','kind','只改服装区域','select',['固定人物','只改服装区域','多角度转身','换背景','图生视频（可灵 / 即梦）','口播台词与配音'])}${field('客户确认的口播稿（为空则生成无功能承诺示例）','line','','textarea')}<button class="primary" id="generate">生成中英提示词</button></div></div><div><div class="notice" style="margin-top:0">上传图号按实际顺序调整。只使用批准母版；缺失的商品结构不补造。提示词无法保证一致性，必须逐镜验收。</div><div class="card panel"><div class="row"><h3>中文提示词</h3><button data-copy="zh">复制中文</button></div><div class="prompt" id="zh">选择人物和商品，开始生成。</div></div><div class="card"><div class="row"><h3>English prompt</h3><button data-copy="en">复制英文</button></div><div class="prompt" id="en">Select a model and product to begin.</div></div></div></div>`}
function generate(){const m=db.models.find(x=>x.id===document.getElementById('genModel').value),s=db.products.find(x=>x.id===document.getElementById('genProduct').value);if(!m||!s)return toast('请先建立人物和商品资料');const get=k=>document.getElementById('f-'+k).value,scene=get('scene'),action=get('action'),angle=get('angle'),kind=get('kind'),identity=`${m.code}/${m.version}`,facts=`SKU ${s.sku}；${s.category}；颜色 ${s.color}；材质 ${s.material}；结构 ${s.structure}`,enFacts=`SKU ${s.sku}; category: ${s.category}; color reference: ${s.color}; material: ${s.material}; verified construction notes (source language): ${s.structure}`;let zh='',en='';
const zbase=`唯一人物：${identity} ${m.name}。脸部：${m.face}。比例：${m.body}。身高：${m.height}。肤色：${m.skin}。发型：${m.hair}。妆容：${m.makeup}。皮肤：${m.detail}。\n`,ebase=`Use the approved identity package ${identity} (${m.name}) as the sole identity reference. Preserve facial anatomy, eye spacing, nose, lips, jaw, ears, hairline, skin marks and body proportions. Profile constraints in source language: ${m.face}; ${m.body}; ${m.height}; ${m.skin}; ${m.hair}; ${m.makeup}; ${m.detail}.\n`;
if(kind==='固定人物'){zh=`图1为批准正脸，图2为对应侧脸，图3为全身比例母版。${zbase}生成${angle}参考照；仅改变头部角度或指定姿势。保留基础服装、背景与柔光。自然皮肤纹理、细微不对称，禁止磨皮、广角拉伸。`;en=`Image 1: approved front face; image 2: matching profile; image 3: full-body proportions. ${ebase}Create ${angle}. Change only the requested angle or pose. Keep basic clothing, background and soft light. Natural skin texture and subtle asymmetry; no plastic skin or wide-angle distortion.`}
else if(kind==='只改服装区域'){zh=`图1–3：${identity}批准人物包；图4：真实商品正面；图5：背面；图6：细节。\n${zbase}${facts}。只编辑服装区域及必要接触阴影。脸、头发、身体、手脚、背景、构图和镜头保持不变。准确保留领型、门襟、口袋位置数量、缝线、标志和下摆。输出${angle}，不补造不可见结构，不为衣服改变体型。`;en=`Images 1–3: approved ${identity} identity package; image 4: actual product front; image 5: back; image 6: details. ${ebase}${enFacts}. Edit only the garment mask and necessary contact shadows. Preserve face, hair, body, hands, feet, background, composition and camera. Match collar, closure, pocket count and placement, seams, logo and hem exactly. Output ${angle}. Do not invent unseen construction or reshape the body to fit clothing.`}
else if(kind==='换背景'){zh=`图1：批准的 ${identity}/${s.sku} 穿衣图；图2：目标场景。${zbase}只把背景替换为${scene}。锁定服装结构与颜色、人物姿态、脸和身体。匹配原机位高度、透视和主光方向，只调整必要接触阴影、反射和边缘融合。不增加人物，不改标志或口袋。`;en=`Image 1: approved dressed still ${identity}/${s.sku}; image 2: target scene. ${ebase}Replace only the background with ${scene}. Lock garment construction, color, pose and identity. Match camera height, perspective and key-light direction. Adjust only necessary contact shadows, reflections and edge blending. Add no people; keep logos and pockets unchanged.`}
else if(kind==='多角度转身'||kind==='图生视频（可灵 / 即梦）'){zh=`图1：批准穿衣首帧 ${identity}/${s.sku}；图2：对应侧脸；图3：真实商品对应视角。${zbase}${facts}。固定机位、全身竖屏9:16、相同焦段观感与光线。场景：${scene}。动作：${action}。每段约3–5秒，仅一个动作，随后自然停住。保持服装结构和颜色；头发自然运动，皮肤不闪烁，不换脸、不瘦身、不增长腿部。不同时换景、换装、加口播。${kind==='多角度转身'?'分别制作正面、侧面、背面并批准后剪辑，只标多角度展示，不冒充连续360度。':'可灵/即梦使用批准静态图为首帧；支持时附侧脸或首尾帧，记录实际模型与设置。'}查首中尾及侧脸经过帧；连续两次失败时缩小动作或改剪辑。`;en=`Image 1: approved dressed first frame ${identity}/${s.sku}; image 2: matching profile; image 3: actual garment angle. ${ebase}${enFacts}. Locked camera, full-body 9:16 vertical framing, consistent focal-length appearance and lighting. Scene: ${scene}. Single action: ${action}. Use a short 3–5 second segment, then pause naturally. Preserve garment structure and color, natural hair motion and stable skin. No face replacement, slimming or leg elongation. Do not combine scene changes, outfit changes or speech. ${kind==='多角度转身'?'Approve front, side and back stills separately, then edit short clips as a multi-angle presentation, not a continuous 360-degree turn.':'For Kling/Jimeng, use an approved still as the first frame; attach profile or end frame if available. Record actual model and settings.'}Inspect first, middle, final and profile-transition frames. After two failures, reduce motion or change the edit.`}
else{const line=get('line').trim()||'今天看看这款服装的正面、侧面和背面。';const proven=s.claims.filter(c=>c.evidence&&c.source.trim()).map(c=>c.text+'（'+c.source+'）').join('；');zh=`${zbase}正面半身，目视镜头，嘴部无遮挡，轻微点头，双手放松，固定机位。\n台词（客户确认后使用）：“${line}”\n仅可参考已记录证据的卖点：${proven||'暂无，不加入功能卖点'}。不虚构体验、价格、尺码或性能。\n配音：${m.voice}。许可与读音：${m.voiceRights}。先听音轨确认品牌、尺码与数字，再做口型；转身与背面用旁白。AI身份需声明。`;en=`${ebase}Front-facing medium shot, looking at camera, mouth unobstructed, subtle nods, relaxed hands, locked camera.\nSpeak this client-approved script in its written language (do not invent a translation): “${line}”\nEvidence-backed claims only: ${proven||'none; make no performance claims'}. Do not invent experiences, pricing, size fit or performance.\nVoice profile: ${m.voice}. License and pronunciation notes: ${m.voiceRights}. Approve the final audio and brand/size/number pronunciations before lip sync. Use voiceover for back views and turns. Disclose AI production.`}

function shotForm(id){const project=p(),x=project.shots.find(s=>s.id===id)||{};openForm(id?'编辑镜头':'新增镜头',`<div class="grid">${field('镜号','number',x.number||project.shots.length+1,'number')}${field('时长（秒）','duration',x.duration||4,'number')}${field('所属视频 / 文件版本','video',x.video||'主片 v01')}${field('状态','status',x.status||'待制作','select',['待制作','制作中','待审核','已批准','返修'])}${field('画面 / 批准首帧ID','visual',x.visual,'textarea')}${field('单一动作','action',x.action,'textarea')}${field('台词 / 旁白','line',x.line,'textarea')}${field('使用的提示词 / 模型 / 实际设置','prompt',x.prompt,'textarea')}</div>`,v=>{Object.assign(x,v);if(!x.id){x.id=uid();project.shots.push(x)}})}
function scripts(){const x=p();return head('分镜与脚本','将人物、服装和一个动作写清楚，每镜绑定批准首帧。')+picker()+(x?`<div class="sectionhead"><h2>${esc(x.name)} <span class="badge">${x.shots.length} 镜 · ${x.shots.reduce((s,a)=>s+Number(a.duration),0)} 秒</span></h2><div class="tools"><button id="templateShots">添加基础脚本</button><button class="primary" id="newShot">＋ 新增镜头</button></div></div><div class="card tablewrap"><table><thead><tr><th>镜号 / 视频</th><th>时长</th><th>画面 / 动作</th><th>台词</th><th>提示词</th><th>状态</th><th>操作</th></tr></thead><tbody>${x.shots.map(s=>`<tr><td>${esc(s.number)}<br>${esc(s.video)}</td><td>${esc(s.duration)}s</td><td>${esc(s.visual)}<p class="muted">${esc(s.action)}</p></td><td>${esc(s.line)}</td><td style="max-width:260px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(s.prompt)}</td><td><span class="badge">${esc(s.status)}</span></td><td><button data-shot="${s.id}">编辑</button><button data-delshot="${s.id}">删除</button></td></tr>`).join('')}</tbody></table>${!x.shots.length?'<div class="empty">从一位模特、一款商品和一句口播开始。点击「添加基础脚本」建立 4 镜模板。</div>':''}</div>`:'<div class="empty">请先新建项目</div>')}
const blockerNames=['身份明显变化','错误 SKU／颜色','关键商品失真','虚构事实','无效授权'];
function releaseReady(x){return x&&qcDefs.every((_,i)=>x.qc?.[i]?.pass)&&!blockerNames.some((_,i)=>x.blockers?.[i])&&x.rights==='已授权'}
function quality(){const x=p();return head('质检清单','正常速度全片 → 首中尾逐帧 → 对照母版与真图 → 修复复查。')+picker()+(x?`<div class="grid"><div class="card"><div class="row"><h2>真实感与交付检查</h2><span class="badge">${Object.values(x.qc).filter(a=>a.pass).length} / 13 通过</span></div>${qcDefs.map(([a,b],i)=>`<div class="check"><input aria-label="${a}通过" type="checkbox" data-qc="${i}" ${x.qc[i]?.pass?'checked':''}><div class="body"><b>${a}</b><p class="muted">${b}</p><input aria-label="${a}问题记录" placeholder="文件版本｜时间码｜截图路径｜问题｜原始依据｜责任岗位｜复查结论" type="text" data-qcnote="${i}" value="${esc(x.qc[i]?.note||'')}"><small>${esc(x.qc[i]?.time||'未检查')}</small></div></div>`).join('')}</div><div><div class="card panel"><h2>不可放行项</h2><p class="muted">发现即标记，修复后再取消；不能用综合评分抵消。</p>${blockerNames.map((a,i)=>`<label class="check danger" style="padding:12px;margin-top:8px;border-radius:6px"><input type="checkbox" data-block="${i}" ${x.blockers[i]?'checked':''}><b>${a}</b></label>`).join('')}<div class="notice ${releaseReady(x)?'':'danger'}">${releaseReady(x)?'所有检查通过、授权有效，可以提交放行。':'尚未满足放行：13 项通过、无不可放行问题、项目授权有效。'}</div><button class="primary" id="release">确认质检放行并进入交付</button><p class="muted" style="font-size:12px;margin-top:12px">${x.released?'上次放行：'+esc(x.releaseTime):'尚无放行记录'}</p></div><div class="card"><h3>需要返修时</h3><p class="muted">回到原始批准母版；连续两次失败，缩小转角、改剪辑或采用实拍。商品错误不能用字幕遮挡。</p></div></div></div>`:'<div class="empty">请先新建项目</div>')}
function costs(){const x=p();if(!x)return head('交付与成本','记录全部生成和失败重试。')+picker();const total=x.logs.reduce((s,a)=>s+Number(a.cost),0),hours=x.logs.reduce((s,a)=>s+Number(a.hours),0);return head('交付与成本','完整记录生成、失败重试、人工、授权与客户确认。')+picker()+`<div class="stats"><div class="stat">生成次数<strong>${x.logs.reduce((s,a)=>s+Number(a.count),0)}</strong><small>包括失败与重试</small></div><div class="stat">实际花费<strong>¥${total.toFixed(2)}</strong><small>所有记录使用人民币</small></div><div class="stat">累计工时<strong>${hours.toFixed(1)}<small> 小时</small></strong><small>人工成本需按费率另记花费</small></div><div class="stat">预算余额<strong>¥${(Number(x.budget)-total).toFixed(2)}</strong><small>预算 ¥${Number(x.budget).toFixed(2)}</small></div></div><div class="card panel"><div class="row"><h2>成本流水</h2><button id="newCost">＋ 记录生成 / 成本</button></div><div class="tablewrap"><table><thead><tr><th>日期 / 项目</th><th>生成次数</th><th>花费（元）</th><th>工时（小时）</th><th>备注</th><th></th></tr></thead><tbody>${x.logs.map(a=>`<tr><td>${esc(a.date)}<br>${esc(a.tool)}</td><td>${esc(a.count)}</td><td>${esc(a.cost)}</td><td>${esc(a.hours)}</td><td>${esc(a.note)}</td><td><button data-delete="logs|${a.id}">删除</button></td></tr>`).join('')}</tbody></table></div><div class="row" style="margin-top:16px"><span class="muted">报价 = 完整成本 ÷（1 − 目标毛利率）；费率和工具分摊须自行录入。</span><div>目标毛利率 <input id="margin" type="number" min="0" max="99" value="40" style="width:75px"> % → <b id="quote">¥${(total/.6).toFixed(2)}</b></div></div></div><div class="grid"><div class="card"><div class="row"><h2>交付文件清单</h2><button id="newFile">＋ 添加文件</button></div>${x.files.map(a=>`<div class="check"><div class="body"><b>${esc(a.name)}</b><p class="muted">${esc(a.path)}</p><span class="badge">${esc(a.version)} · ${esc(a.status)}</span><p>${esc(a.note)}</p></div><button data-delete="files|${a.id}">删除</button></div>`).join('')||'<div class="empty" style="margin-top:16px">登记封面、字幕版、无字幕版、字幕文件与工程文件路径。这里只记录清单，不托管视频。</div>'}</div><div class="card"><div class="row"><h2>客户确认记录</h2><button id="newConfirm">＋ 记录确认</button></div>${x.confirmations.map(a=>`<div class="check"><div class="body"><b>${esc(a.who)} · ${esc(a.date)}</b><p>${esc(a.scope)}</p><p class="muted">版本 / 依据：${esc(a.proof)}</p></div><button data-delete="confirmations|${a.id}">删除</button></div>`).join('')||'<div class="empty" style="margin-top:16px">保留静态图、台词、交付与变更范围的确认依据。</div>'}</div></div>`}
function render(){document.getElementById('nav').innerHTML=modules.map((s,i)=>`<button data-page="${i}" class="${i===page?'active':''}"><span>${['▦','▧','♧','✧','▤','☑','▱'][i]}</span>${s}</button>`).join('');document.getElementById('crumb').textContent=modules[page];document.getElementById('app').innerHTML=[dashboard,products,models,prompts,scripts,quality,costs][page]();bind()}
function on(id,fn,event='click'){const el=document.getElementById(id);if(el)el.addEventListener(event,fn)}
function bind(){document.querySelectorAll('[data-page]').forEach(e=>e.onclick=()=>{page=Number(e.dataset.page);render();window.scrollTo(0,0)});on('newProject',()=>projectForm());document.querySelectorAll('[data-project]').forEach(e=>e.onclick=()=>projectForm(e.dataset.project));on('newProduct',()=>productForm());document.querySelectorAll('[data-product]').forEach(e=>e.onclick=()=>productForm(e.dataset.product));on('newModel',()=>modelForm());document.querySelectorAll('[data-model]').forEach(e=>e.onclick=()=>modelForm(e.dataset.model));on('projectSelect',e=>{selected=e.target.value;render()},'change');on('marketFilter',e=>{modelMarket=e.target.value;render()},'change');on('categoryFilter',e=>{modelCategory=e.target.value;render()},'change');
document.querySelectorAll('[data-claim]').forEach(e=>e.onclick=()=>openForm('添加卖点与证据',field('卖点','text')+field('是否已有证据','evidence','待补证','select',['待补证','有证据'])+field('证据来源 / 路径 / 客户确认记录','source','','textarea'),v=>{if(!v.text.trim()||(v.evidence==='有证据'&&!v.source.trim()))throw toast('请填写卖点；有证据时必须填写来源');db.products.find(x=>x.id===e.dataset.claim).claims.push({...v,evidence:v.evidence==='有证据'})}));document.querySelectorAll('[data-delclaim]').forEach(e=>e.onclick=()=>{const[id,i]=e.dataset.delclaim.split('|');db.products.find(x=>x.id===id).claims.splice(Number(i),1);save();render()});
document.querySelectorAll('[data-upload]').forEach(e=>e.onchange=async()=>{const file=e.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type))return toast('请选择 PNG、JPEG 或 WebP 图片');if(file.size>12*1024*1024)return toast('单张图片请小于 12 MB');try{const data=await imageData(file);const[type,id,angle]=e.dataset.upload.split('|'),x=db[type].find(v=>v.id===id),old=x.images[angle];x.images[angle]=data;if(!save()){if(old)x.images[angle]=old;else delete x.images[angle]}render()}catch{toast('图片无法读取，请更换有效图片')}});document.querySelectorAll('[data-remove]').forEach(e=>e.onclick=()=>{const[type,id,a]=e.dataset.remove.split('|');delete db[type].find(x=>x.id===id).images[a];save();render()});on('generate',generate);document.querySelectorAll('[data-copy]').forEach(e=>e.onclick=async()=>{const t=document.getElementById(e.dataset.copy).textContent;try{await navigator.clipboard.writeText(t);toast('已复制')}catch{const ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已复制':'复制不可用，请手动选择文本')}});
on('newShot',()=>shotForm());document.querySelectorAll('[data-shot]').forEach(e=>e.onclick=()=>shotForm(e.dataset.shot));document.querySelectorAll('[data-delshot]').forEach(e=>e.onclick=()=>{p().shots=p().shots.filter(x=>x.id!==e.dataset.delshot);save();render()});on('templateShots',()=>{[['正面半身，批准首帧待绑定','轻微点头','今天看看这款服装。',4],['全身正面至侧面','向自身左侧缓慢转45度','',5],['背面与另一侧，单独批准首帧','小角度侧转','',5],['真实面料、口袋细节及收尾','静态特写','',4]].forEach(([visual,action,line,duration],i)=>p().shots.push({id:uid(),video:'主片 v01',number:p().shots.length+1,visual,action,line,duration,prompt:'待从提示词生成器复制；补充模型及实际设置',status:'待制作'}));save();render()});
document.querySelectorAll('[data-qc]').forEach(e=>e.onchange=()=>{const x=p(),i=e.dataset.qc;x.qc[i]={...x.qc[i],pass:e.checked,time:new Date().toLocaleString('zh-CN')};invalidate(x);save();render()});document.querySelectorAll('[data-qcnote]').forEach(e=>e.onchange=()=>{const x=p(),i=e.dataset.qcnote;x.qc[i]={...x.qc[i],note:e.value,pass:false,time:new Date().toLocaleString('zh-CN')};invalidate(x);save();render()});document.querySelectorAll('[data-block]').forEach(e=>e.onchange=()=>{p().blockers[e.dataset.block]=e.checked;invalidate(p());save();render()});on('release',()=>{if(!releaseReady(p()))return toast('不可放行：请通过全部检查、处理阻断问题并确认项目授权');p().released=true;p().releaseTime=new Date().toLocaleString('zh-CN');p().stage='交付';save();render();toast('质检已放行，项目进入交付')});
on('newCost',()=>openForm('记录生成与全部成本',`<div class="grid">${field('日期','date',today(),'date')}${field('工具 / 人工 / 授权 / 分摊','tool')}${field('生成次数（含失败重试）','count',1,'number')}${field('花费（人民币；外币先折算）','cost',0,'number')}${field('工时（小时）','hours',0,'number')}${field('备注 / 失败原因 / 汇率','note','','textarea')}</div>`,v=>p().logs.push({...v,id:uid()})));on('newFile',()=>openForm('添加交付文件',field('文件名','name')+field('本地路径 / 交付地址','path')+field('文件版本','version','v01')+field('状态','status','待交付','select',['待交付','已交付','客户已确认'])+field('格式 / 分辨率 / 字幕 / 授权范围','note','','textarea'),v=>p().files.push({...v,id:uid()})));on('newConfirm',()=>openForm('记录客户确认',field('确认人','who')+field('确认日期','date',today(),'date')+field('确认范围 / 修改费用与排期','scope','','textarea')+field('文件版本 / 确认截图路径 / 来源','proof','','textarea'),v=>p().confirmations.push({...v,id:uid()})));document.querySelectorAll('[data-delete]').forEach(e=>e.onclick=()=>{const[k,id]=e.dataset.delete.split('|');p()[k]=p()[k].filter(a=>a.id!==id);save();render()});on('margin',e=>{const n=Number(e.target.value),total=p().logs.reduce((s,a)=>s+Number(a.cost),0);document.getElementById('quote').textContent=n>=0&&n<100?'¥'+(total/(1-n/100)).toFixed(2):'请输入 0–99'},'input');}
function invalidate(x){if(!releaseReady(x)){x.released=false;if(x.stage==='交付')x.stage='质检'}}
async function imageData(file){const bitmap=await createImageBitmap(file),c=document.createElement('canvas'),ratio=Math.min(1,1400/Math.max(bitmap.width,bitmap.height));c.width=Math.round(bitmap.width*ratio);c.height=Math.round(bitmap.height*ratio);c.getContext('2d').drawImage(bitmap,0,0,c.width,c.height);bitmap.close();return c.toDataURL('image/jpeg',.82)}
function validate(data){if(!data||data.version!==1)throw Error('备份版本不支持');for(const k of ['projects','products','models'])if(!Array.isArray(data[k]))throw Error('缺少 '+k);const ids=new Set();for(const k of ['projects','products','models'])for(const x of data[k]){if(!x||typeof x!=='object'||Array.isArray(x)||typeof x.id!=='string'||ids.has(x.id))throw Error('记录编号无效或重复');ids.add(x.id);const nested=k==='projects'?['qc','blockers','shots','logs','files','confirmations']:k==='products'?['claims','images']:['images'];for(const [key,val] of Object.entries(x))if(val!==null&&typeof val==='object'&&!nested.includes(key))throw Error('字段格式无效：'+key);if(Object.values(x).some(v=>typeof v==='function'))throw Error('无效数据');if(k==='projects'){if(!stages.includes(x.stage))throw Error('项目状态无效');for(const a of ['shots','logs','files','confirmations'])if(!Array.isArray(x[a]))throw Error('项目明细格式无效');if(!x.qc||!x.blockers||Array.isArray(x.qc)||Array.isArray(x.blockers)||typeof x.qc!=='object'||typeof x.blockers!=='object')throw Error('缺少质检记录');for(const a of ['shots','logs','files','confirmations'])for(const row of x[a])if(!row||typeof row!=='object'||Array.isArray(row))throw Error('项目明细记录无效');for(const row of Object.values(x.qc))if(!row||typeof row!=='object'||typeof row.pass!=='boolean')throw Error('质检记录无效');if(!Number.isFinite(Number(x.budget))||Number(x.budget)<0)throw Error('预算无效');for(const l of x.logs)for(const f of ['cost','count','hours'])if(!Number.isFinite(Number(l[f]))||Number(l[f])<0)throw Error('成本数据无效')}else{if(!x.images||typeof x.images!=='object'||Array.isArray(x.images))throw Error('图片格式无效');for(const src of Object.values(x.images))if(typeof src!=='string'||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(src))throw Error('图片必须是本地 base64 数据');if(k==='products'){if(!Array.isArray(x.claims))throw Error('卖点格式无效');for(const c of x.claims)if(!c||typeof c.text!=='string'||typeof c.source!=='string'||typeof c.evidence!=='boolean')throw Error('卖点记录无效')}}}return data}
on('export',()=>{const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Wei工作台备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出全部记录及图片')});on('import',()=>document.getElementById('backup').click());on('backup',async e=>{const f=e.target.files[0];if(!f)return;try{const data=validate(JSON.parse(await f.text()));if(!confirm('导入将替换当前全部数据。请先导出当前备份。确定继续？'))return;const old=db;db=data;if(!save()){db=old;return}db.projects.forEach(invalidate);save();selected=db.projects[0]?.id||'';render();toast('备份已导入')}catch(err){toast('导入失败：'+err.message)}finally{e.target.value=''}},'change');
render();
